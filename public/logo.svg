<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <!-- House Blue Gradient -->
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="60%" stop-color="#0088cc" />
      <stop offset="100%" stop-color="#00a8e8" />
    </linearGradient>

    <!-- Signal Arc 1 (Inner Purple) -->
    <linearGradient id="arcInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <!-- Signal Arc 2 (Middle Cyan/Blue) -->
    <linearGradient id="arcMidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088cc" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Signal Arc 3 (Outer Violet/Purple) -->
    <linearGradient id="arcOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Mask to punch out wifi waves from house body -->
    <mask id="houseCutoutMask">
      <!-- White everywhere so house is visible -->
      <rect width="500" height="520" fill="#ffffff" />
      <!-- Black cutout for the wave sector at bottom-left of house (center approx at 145, 345) -->
      <circle cx="145" cy="345" r="162" fill="#000000" />
    </mask>
  </defs>

  <!-- Group for the House Icon -->
  <g id="smart-house-emblem">
    <!-- Base House with Cutout Mask -->
    <path
      d="
        M 250 42
        L 380 148
        V 82
        H 404
        V 168
        L 435 193
        A 10 10 0 0 1 426 208
        H 395
        V 335
        A 22 22 0 0 1 373 357
        H 127
        A 22 22 0 0 1 105 335
        V 208
        H 74
        A 10 10 0 0 1 65 193
        L 250 42
        Z
      "
      fill="url(#houseGrad)"
      mask="url(#houseCutoutMask)"
    />

    <!-- Cutout Filler Backing for Smooth Negative Space -->
    <!-- Arc 3 (Outer Arc - Purple) -->
    <path
      d="
        M 145 198
        A 147 147 0 0 1 292 345
        H 254
        A 109 109 0 0 0 145 236
        Z
      "
      fill="url(#arcOuterGrad)"
    />

    <!-- Arc 2 (Middle Arc - Blue/Cyan) -->
    <path
      d="
        M 145 251
        A 94 94 0 0 1 239 345
        H 203
        A 58 58 0 0 0 145 287
        Z
      "
      fill="url(#arcMidGrad)"
    />

    <!-- Arc 1 (Inner Arc - Magenta/Purple Quarter/Dot) -->
    <path
      d="
        M 145 303
        A 42 42 0 0 1 187 345
        H 145
        Z
      "
      fill="url(#arcInnerGrad)"
    />
  </g>

  <!-- Typography: Smart System -->
  <g id="smart-system-text" transform="translate(250, 440)" text-anchor="middle">
    <text
      font-family="'Tajawal', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
      font-size="62"
      font-weight="800"
      letter-spacing="-1"
    >
      <tspan fill="#3a3e45" dx="-8">Smart </tspan>
      <tspan fill="#0088cc" dx="4">System</tspan>
    </text>
  </g>
</svg>
